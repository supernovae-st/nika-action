name: ci

# The action's own proof: (1) the renderer's unit tests run against REAL
# captured fixtures (clean · broken-JSON · parse-fatal non-JSON), (2) the
# composite action executes end-to-end on this very repo — install
# (SHA256SUMS-verified) → check → render → step summary, (3) a smoke lane
# probes every subcommand this repo teaches against the served release
# binary — a verb the engine dropped dies HERE, not in a consumer's run.
# No user-controlled input reaches the shell (the only expression consumed
# is a step outcome, a runner-controlled enum).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: renderer unit tests (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  smoke:
    name: taught subcommands answer in the served engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the served default (SHA256SUMS-verified)
        run: |
          set -euo pipefail
          # the same read release-heal uses: the probe always follows action.yml
          ver="$(sed -n "s/.*default: '\([0-9][0-9.]*\)'.*/\1/p" action.yml | head -1)"
          bash scripts/install_nika.sh "${ver}"
      - name: Probe every subcommand this repo teaches
        run: |
          set -euo pipefail
          # action.yml runs check · test · inspect — the README also teaches new
          for sub in check test inspect new; do
            if ! nika "${sub}" --help > /dev/null; then
              echo "::error::taught subcommand died: nika ${sub} --help — this repo teaches a verb the served engine no longer ships"
              exit 1
            fi
            echo "nika ${sub} --help · rc=0"
          done

  e2e:
    name: the action runs itself (check lane)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clean workflow → exit 0
        uses: ./
        with:
          workflow: fixtures/flow.nika.yaml
          comment: 'false'
      - name: Broken workflow → exit 2 (expected failure)
        id: broken
        continue-on-error: true
        uses: ./
        with:
          workflow: fixtures/broken.nika.yaml
          comment: 'false'
      - name: The broken lane MUST have failed
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "::error::broken fixture did not fail the gate"
            exit 1
          fi
          echo "gate semantics proven: clean passes, findings fail"
      - name: Test lane → golden passes offline (mock provider)
        uses: ./
        with:
          workflow: fixtures/flow.nika.yaml
          mode: test
          comment: 'false'
      - name: Unknown mode → refused (expected failure)
        id: badmode
        continue-on-error: true
        uses: ./
        with:
          workflow: fixtures/flow.nika.yaml
          mode: run
          comment: 'false'
      - name: The unknown mode MUST have been refused
        run: |
          if [ "${{ steps.badmode.outcome }}" != "failure" ]; then
            echo "::error::unknown mode was silently accepted"
            exit 1
          fi
          echo "mode validation proven: run is refused by design"
